name: Fix admin case editing UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/admin/admin-shell.tsx')
          s = p.read_text()

          # Remove duplicated quick actions.
          s = s.replace('''              <QuickAction icon={<FilePlus2 size={14} />} label="تكليفات" onClick={() => setModal({ kind: 'task', data: { multi: true } })} />\n              <QuickAction icon={<Users2 size={14} />} label="تكليفات" onClick={() => setModal({ kind: 'task', data: { multi: true } })} />\n''', '''              <QuickAction icon={<FilePlus2 size={14} />} label="تكليفات" onClick={() => setModal({ kind: 'task', data: { multi: true } })} />\n''')
          s = s.replace('''              <QuickAction icon={<Landmark size={14} />} label="إضافة محكمة أو جهة" onClick={() => setModal({ kind: 'location' })} />\n              <QuickAction icon={<Building2 size={14} />} label="إضافة محكمة أو جهة" onClick={() => setModal({ kind: 'location' })} />\n''', '''              <QuickAction icon={<Landmark size={14} />} label="إضافة محكمة أو جهة" onClick={() => setModal({ kind: 'location' })} />\n''')

          # Add proper case-edit state and save handler.
          old = '''  const [openId, setOpenId] = React.useState<string | null>(null);\n  const [newEvent, setNewEvent] = React.useState<Record<string, string>>({});\n  const [busy, setBusy] = React.useState(false);\n'''
          new = '''  const [openId, setOpenId] = React.useState<string | null>(null);\n  const [newEvent, setNewEvent] = React.useState<Record<string, string>>({});\n  const [editCase, setEditCase] = React.useState<AdminShellProps['cases'][number] | null>(null);\n  const [editName, setEditName] = React.useState('');\n  const [editNumber, setEditNumber] = React.useState('');\n  const [editClientName, setEditClientName] = React.useState('');\n  const [busy, setBusy] = React.useState(false);\n'''
          if old not in s:
              raise SystemExit('case state anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const addEvent = async (caseId: string) => {\n'''
          new = '''  const saveCase = async () => {\n    if (!editCase || busy) return;\n    const name = editName.trim();\n    const number = editNumber.trim();\n    if (!name || !number) {\n      toastError('اسم القضية ورقم القضية مطلوبان.');\n      return;\n    }\n    setBusy(true);\n    const res = await fetch(`/api/cases/${editCase.id}`, {\n      method: 'PATCH',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ name, number, clientName: editClientName.trim() || null }),\n    });\n    const d = await res.json().catch(() => ({}));\n    setBusy(false);\n    if (res.ok) {\n      toastSuccess('تم تعديل القضية ✓');\n      setEditCase(null);\n      router.refresh();\n    } else {\n      toastError(d.error ?? 'تعذر تعديل القضية.');\n    }\n  };\n\n  const addEvent = async (caseId: string) => {\n'''
          if old not in s:
              raise SystemExit('addEvent anchor not found')
          s = s.replace(old, new, 1)

          old = '''                <button onClick={() => { const name = window.prompt('اسم القضية', item.name); if (name === null) return; const number = window.prompt('رقم القضية', item.number); if (number === null) return; const clientName = window.prompt('اسم العميل', item.clientName ?? ''); if (clientName === null) return; void fetch(`/api/cases/${item.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, number, clientName: clientName || null }) }).then(async (r) => { const d = await r.json().catch(() => ({})); if (r.ok) { toastSuccess('تم تعديل القضية ✓'); router.refresh(); } else toastError(d.error ?? 'تعذر تعديل القضية.'); }); }} className="rounded-md px-2.5 py-1.5 text-[11px] font-bold text-navy-500 hover:bg-navy-900/5">تعديل</button>\n'''
          new = '''                <button\n                  onClick={() => {\n                    setEditCase(item);\n                    setEditName(item.name);\n                    setEditNumber(item.number);\n                    setEditClientName(item.clientName ?? '');\n                  }}\n                  className="rounded-md px-2.5 py-1.5 text-[11px] font-bold text-navy-500 hover:bg-navy-900/5"\n                >\n                  تعديل\n                </button>\n'''
          if old not in s:
              raise SystemExit('old case edit button not found')
          s = s.replace(old, new, 1)

          old = '''      )}\n    </Card>\n  );\n}\n\nfunction ActivityTab'''
          new = '''      )}\n\n      <Modal\n        open={!!editCase}\n        onClose={() => setEditCase(null)}\n        title={editCase ? `تعديل القضية: ${editCase.name}` : 'تعديل القضية'}\n        footer={\n          <div className="flex justify-end gap-2">\n            <Button variant="ghost" onClick={() => setEditCase(null)} disabled={busy}>إلغاء</Button>\n            <Button variant="gold" onClick={saveCase} disabled={busy}>\n              {busy ? 'جارٍ الحفظ…' : 'حفظ التعديلات'}\n            </Button>\n          </div>\n        }\n      >\n        <div className="space-y-4">\n          <Field label="اسم القضية">\n            <Input value={editName} onChange={(e) => setEditName(e.target.value)} autoFocus />\n          </Field>\n          <Field label="رقم القضية">\n            <Input value={editNumber} onChange={(e) => setEditNumber(e.target.value)} dir="ltr" className="font-latin" />\n          </Field>\n          <Field label="اسم العميل">\n            <Input value={editClientName} onChange={(e) => setEditClientName(e.target.value)} />\n          </Field>\n        </div>\n      </Modal>\n    </Card>\n  );\n}\n\nfunction ActivityTab'''
          if old not in s:
              raise SystemExit('case modal anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/admin-shell.tsx
          git commit -m "fix: repair admin case edit modal and duplicate actions" || exit 0
          git push
          git rm .github/workflows/fix-admin-case-edit.yml
          git commit -m "chore: remove temporary fix workflow"
          git push
