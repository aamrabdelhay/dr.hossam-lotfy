name: Apply office updates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply requested office changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  print(f'SKIP {path}: pattern not found')
                  return
              p.write_text(s.replace(old,new,count))
              print(f'UPDATED {path}')

          # 1) Lawyers can edit themselves; admin lawyers have the same admin capabilities.
          replace('src/app/api/lawyers/[id]/route.ts',
            "  const isAdmin = session.role === 'admin';\n  const isSelf = session.role === 'lawyer' && session.lawyerId === id;\n  if (!isAdmin && !isSelf) return json({ error: 'لا تملك صلاحية تعديل هذا الملف' }, { status: 403 });\n\n  const data = await readJson(req as never, updateSchema);",
            "  const isAdmin = session.role === 'admin' || (session.role === 'lawyer' && session.isAdmin);\n  const isSelf = session.role === 'lawyer' && session.lawyerId === id;\n  if (!isAdmin && !isSelf) return json({ error: 'لا تملك صلاحية تعديل هذا الملف' }, { status: 403 });\n\n  const data = await readJson(req as never, updateSchema);")
          replace('src/app/api/lawyers/[id]/route.ts',
            "  const payload: Record<string, unknown> = isAdmin\n    ? data\n    : { fullName: data.fullName, title: data.title, phone: data.phone, email: data.email, googleEmail: data.googleEmail, specialization: data.specialization, bio: data.bio, position: data.position };",
            "  const payload: Record<string, unknown> = isAdmin\n    ? data\n    : { fullName: data.fullName, title: data.title, phone: data.phone, email: data.email, googleEmail: data.googleEmail, specialization: data.specialization, bio: data.bio, position: data.position };")

          # 2) Admin lawyers can edit tasks from all surfaces, including historical/completed tasks.
          replace('src/app/sessions/[id]/page.tsx',
            "  const isAdmin = role === 'admin';\n  const iAmAuthor = myLawyerId != null && task.author?.id === myLawyerId;\n  const canEdit = isAdmin || iAmAuthor;\n  const canWriteTasks = session !== null && session.role === 'admin' && can(session.userRole, 'writeTasks');",
            "  const isAdmin = role === 'admin' || (role === 'lawyer' && session.isAdmin);\n  const iAmAuthor = myLawyerId != null && task.author?.id === myLawyerId;\n  const canEdit = isAdmin || iAmAuthor;\n  const canWriteTasks = session !== null && (session.role === 'admin' ? can(session.userRole, 'writeTasks') : session.isAdmin);")

          # 3) Terminology requested by the office.
          replace('src/components/admin/task-creator.tsx', 'title="إضافة مهمة / جلسة"', 'title="تكليف"')
          replace('src/components/admin/task-creator.tsx', 'placeholder="ابحث بالاسم أو اكتب محكمة جديدة…"', 'placeholder="ابحث بالاسم أو اكتب محكمة أو جهة جديدة…"')
          replace('src/components/session-edit-form.tsx', 'title="تعديل المهمة / الجلسة"', 'title="تعديل"')
          replace('src/components/session-edit-form.tsx', 'label="وصف المهمة — هتعمل إيه؟"', 'label="التكليف — هتعمل إيه؟"')
          replace('src/components/session-edit-form.tsx', 'label="المحكمة / جهة حكومية"', 'label="المحكمة / جهة حكومية"')

          # 4) Remove duplicate quick actions in the admin header and keep the merged labels.
          replace('src/components/admin/admin-shell.tsx',
            '              <QuickAction icon={<Users2 size={14} />} label="تكليفات" onClick={() => setModal({ kind: \'task\', data: { multi: true } })} />\n',
            '')
          replace('src/components/admin/admin-shell.tsx',
            '              <QuickAction icon={<Building2 size={14} />} label="إضافة محكمة أو جهة" onClick={() => setModal({ kind: \'location\' })} />\n',
            '')

          # 5) Remove the old dashboard wording; keep the useful stats themselves.
          replace('src/app/page.tsx',
            '<h1 id="dashboard-title" className="text-lg font-extrabold text-ivory-50">المكتب اليوم</h1>',
            '<span id="dashboard-title" aria-hidden="true" className="sr-only">إحصاءات المكتب</span>')

          # 6) Make first-load feel like a real page transition instead of a hard swap.
          replace('src/app/page.tsx',
            '<div className="mx-auto flex w-full max-w-[1440px] gap-5 px-4 py-5 sm:px-6">',
            '<div className="page-enter mx-auto flex w-full max-w-[1440px] gap-5 px-4 py-5 sm:px-6">')
          replace('src/app/globals.css',
            '/*',
            '/* Page transition */\n@keyframes hl-page-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n.page-enter { animation: hl-page-enter 420ms ease-out both; }\n@media (prefers-reduced-motion: reduce) { .page-enter { animation: none; } }\n\n/*',
            1)

          # 7) Admin can manage the archive from the existing archive screen.
          replace('src/app/cases/archive/page.tsx',
            '<Link href="/admin?tab=cases" className="rounded-full border border-navy-200 px-4 py-2 text-[12px] font-bold text-navy-600 transition hover:border-gold-500 hover:text-gold-700">إدارة ملفات القضايا</Link>',
            '<Link href="/admin?tab=cases" className="rounded-full border border-navy-200 px-4 py-2 text-[12px] font-bold text-navy-600 transition hover:border-gold-500 hover:text-gold-700">إدارة وتعديل القضايا</Link>')

          # 8) Admin "complete on behalf" becomes an approval request to the assigned lawyer.
          p=Path('src/app/api/tasks/[id]/complete/route.ts'); s=p.read_text()
          old="""  // ── أدمن بصلاحية writeTasks: إغلاق نيابةً عن المحامي ──
  if (session.role === 'admin') {
    if (!can(session.userRole, 'writeTasks')) {
      return json({ error: 'لا تملك صلاحية تسجيل تنفيذ المهمة' }, { status: 403 });
    }
    if (task.status === 'COMPLETED') return json({ error: 'هذه المهمة مسجلة كمكتملة بالفعل' }, { status: 409 });

    const remaining = await prisma.taskAssignment.findMany({ where: { taskId: id, completedAt: null } });
    if (remaining.length > 0) {
      await prisma.taskAssignment.updateMany({
        where: { taskId: id, completedAt: null },
        data: { completedAt: now },
      });
    }
    await prisma.task.update({ where: { id }, data: { status: 'COMPLETED', completedAt: now } });

    await logActivity({
      action: 'COMPLETED',
      summary: `أغلق المهمة نيابةً عن المحامين: ${task.description.slice(0, 70)}`,
      taskId: id,
      locationId: task.locationId,
      byUserId: session.userId,
    });
    await notifyTaskCompleted(id, `الإدارة (${session.name})`, task.description.slice(0, 70), task.location.name);

    return json({ ok: true, completed: true, byAdmin: true });
  }
"""
          new="""  // ── الإدارة تطلب الإنهاء نيابةً عن المحامي؛ المحامي يجب أن يوافق أولاً. ──
  if (session.role === 'admin') {
    if (!can(session.userRole, 'writeTasks')) {
      return json({ error: 'لا تملك صلاحية تسجيل تنفيذ المهمة' }, { status: 403 });
    }
    if (task.status === 'COMPLETED') return json({ error: 'هذه المهمة مسجلة كمكتملة بالفعل' }, { status: 409 });

    const remaining = task.assignees.filter((a) => !a.completedAt);
    if (remaining.length === 0) return json({ error: 'لا توجد إسنادات معلقة لهذه المهمة' }, { status: 409 });

    for (const assignment of remaining) {
      const existing = await prisma.notification.findFirst({
        where: { lawyerId: assignment.lawyerId, type: 'TASK_COMPLETION_REQUEST', link: `/sessions/${id}`, readAt: null },
      });
      if (!existing) {
        await prisma.notification.create({
          data: {
            lawyerId: assignment.lawyerId,
            type: 'TASK_COMPLETION_REQUEST',
            title: 'طلب إنهاء تكليف نيابةً عنك',
            body: `الإدارة تطلب تسجيل تنفيذ التكليف: ${task.description.slice(0, 120)}`,
            link: `/sessions/${id}`,
          },
        });
      }
    }

    await logActivity({
      action: 'COMPLETION_REQUESTED',
      summary: `طلبت الإدارة موافقة المحامين على إنهاء التكليف: ${task.description.slice(0, 70)}`,
      taskId: id,
      locationId: task.locationId,
      byUserId: session.userId,
    });
    return json({ ok: true, requested: true });
  }
"""
          if old not in s: print('SKIP complete route: admin block not found')
          else: p.write_text(s.replace(old,new,1)); print('UPDATED complete route')

          # 9) Add lawyer approval/rejection endpoint.
          p=Path('src/app/api/tasks/[id]/complete-request/route.ts'); p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(r'''import { z } from 'zod';
import { handle, json, readJson, requireLawyer } from '@/lib/api';
import { prisma } from '@/lib/prisma';
import { logActivity } from '@/lib/activity';

type Ctx = { params: Promise<{ id: string }> };
const schema = z.object({ notificationId: z.string().min(1), action: z.enum(['approve', 'reject']) });

export const PATCH = handle(async (req: Request, ctx: Ctx) => {
  const session = await requireLawyer();
  const { id } = await ctx.params;
  const data = await readJson(req as never, schema);
  const assignment = await prisma.taskAssignment.findUnique({ where: { taskId_lawyerId: { taskId: id, lawyerId: session.lawyerId } }, include: { task: { include: { location: true } } } });
  if (!assignment) return json({ error: 'هذا التكليف غير مسند إليك' }, { status: 403 });
  const notification = await prisma.notification.findFirst({ where: { id: data.notificationId, lawyerId: session.lawyerId, type: 'TASK_COMPLETION_REQUEST' } });
  if (!notification) return json({ error: 'طلب الإنهاء غير موجود' }, { status: 404 });
  if (notification.readAt) return json({ error: 'تم التعامل مع هذا الطلب بالفعل' }, { status: 409 });

  await prisma.notification.update({ where: { id: notification.id }, data: { readAt: new Date() } });
  if (data.action === 'reject') {
    await logActivity({ action: 'COMPLETION_REJECTED', summary: `رفض ${session.name} إنهاء التكليف نيابةً عنه: ${assignment.task.description.slice(0, 70)}`, taskId: id, lawyerId: session.lawyerId, locationId: assignment.task.locationId, byLawyerId: session.lawyerId });
    return json({ ok: true, approved: false });
  }

  if (assignment.completedAt) return json({ error: 'هذا التكليف مكتمل بالفعل' }, { status: 409 });
  const now = new Date();
  await prisma.taskAssignment.update({ where: { id: assignment.id }, data: { completedAt: now, completedById: session.lawyerId } });
  const remaining = await prisma.taskAssignment.count({ where: { taskId: id, completedAt: null } });
  await prisma.task.update({ where: { id }, data: remaining === 0 ? { status: 'COMPLETED', completedAt: now } : { status: 'IN_PROGRESS' } });
  await logActivity({ action: 'COMPLETED_BY_APPROVAL', summary: `وافق ${session.name} على إنهاء التكليف الذي طلبته الإدارة: ${assignment.task.description.slice(0, 70)}`, taskId: id, lawyerId: session.lawyerId, locationId: assignment.task.locationId, byLawyerId: session.lawyerId });
  return json({ ok: true, approved: true, completed: remaining === 0 });
});
''')
          print('CREATED complete-request route')

          # 10) Notification UI with approve/reject actions.
          p=Path('src/components/notification-bell.tsx'); s=p.read_text()
          replace('src/components/notification-bell.tsx',
            "  TASK_COMPLETED: 'تم التنفيذ',\n",
            "  TASK_COMPLETED: 'تم التنفيذ',\n  TASK_COMPLETION_REQUEST: 'طلب موافقة',\n")
          marker="""  const markAll = async () => {
"""
          helper="""  const respondToRequest = async (n: BellNotification, action: 'approve' | 'reject') => {
    setBusyId(n.id);
    const taskId = n.link?.split('/').filter(Boolean).pop();
    if (!taskId) { setBusyId(null); return; }
    const res = await fetch(`/api/tasks/${taskId}/complete-request`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notificationId: n.id, action }),
    });
    setBusyId(null);
    if (res.ok) {
      setItems((prev) => prev.map((x) => x.id === n.id ? { ...x, readAt: new Date().toISOString() } : x));
      router.refresh();
    }
  };

"""
          if marker in s and 'respondToRequest' not in s: s=s.replace(marker,helper+marker,1); p.write_text(s)
          # Add action buttons to request notifications.
          p=Path('src/components/notification-bell.tsx'); s=p.read_text()
          old="""                        <span className=\"mt-0.5 block text-[9.5px] text-navy-300\">{timeAgo(n.createdAt)}</span>
                      </span>
                      {!n.readAt && <span className=\"mt-1.5 h-2 w-2 shrink-0 rounded-full bg-gold-500\" />}
"""
          new="""                        <span className=\"mt-0.5 block text-[9.5px] text-navy-300\">{timeAgo(n.createdAt)}</span>
                        {n.type === 'TASK_COMPLETION_REQUEST' && !n.readAt && <span className=\"mt-2 flex gap-1.5\"><span onClick={(e) => { e.stopPropagation(); void respondToRequest(n, 'approve'); }} className=\"rounded-md bg-emerald-600 px-2 py-1 text-[10px] font-bold text-white\">موافقة</span><span onClick={(e) => { e.stopPropagation(); void respondToRequest(n, 'reject'); }} className=\"rounded-md border border-red-200 bg-white px-2 py-1 text-[10px] font-bold text-red-600\">رفض</span></span>}
                      </span>
                      {!n.readAt && <span className=\"mt-1.5 h-2 w-2 shrink-0 rounded-full bg-gold-500\" />}
"""
          if old not in s: print('SKIP notification action markup')
          else: p.write_text(s.replace(old,new,1)); print('UPDATED notification UI')

          # 11) Make admin completion button wording reflect the approval flow.
          replace('src/components/complete-task-button.tsx',
            "  const complete = async () => {",
            "  const complete = async () => {")
          replace('src/components/complete-task-button.tsx',
            "      toastSuccess('تم تسجيل تنفيذ المهمة ✓');",
            "      toastSuccess('تم إرسال طلب موافقة للمحامي ✓');")

          # 12) Remove the requested phone emoji if present anywhere in text/JSX.
          for path in Path('src').rglob('*'):
              if path.is_file() and path.suffix in {'.tsx','.ts','.css'}:
                  s=path.read_text()
                  if '📞' in s:
                      path.write_text(s.replace('📞',''))
                      print('REMOVED PHONE EMOJI', path)
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-office-updates.yml
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "feat: update office admin and lawyer workflows"
          git push origin main
