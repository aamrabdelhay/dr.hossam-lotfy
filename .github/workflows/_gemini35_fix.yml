name: temporary-gemini-35-fix
on:
  push:
    branches:
      - fix/gemini-3-5-flash
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Gemini model only
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' --include='*.js' 'gemini-2.5-flash' . | while IFS= read -r file; do
            sed -i 's/gemini-2\.5-flash/gemini-3.5-flash/g' "$file"
          done
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' --include='*.js' 'gemini-2.5-flash' .; then
            echo 'Old Gemini model still exists.'
            exit 1
          fi
      - name: Commit requested fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_gemini35_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: use Gemini 3.5 Flash for supported production access"
          git push origin HEAD:fix/gemini-3-5-flash
