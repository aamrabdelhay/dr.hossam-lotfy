name: temporary-final-assistant-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check assistant UI source
        run: |
          grep -q 'مراجعة بيانات التنفيذ' src/components/admin/office-assistant.tsx
          grep -q 'GEMINI_API_KEY غير مضبوط' src/components/admin/office-assistant.tsx
          grep -q 'gemini-3.5-flash' src/app/api/assistant/route.ts
          git diff --check
