name: temporary-final-ui-verify
on:
  push:
    branches:
      - fix/gemini-3-5-flash
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify assistant task UX
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'مراجعة بيانات التنفيذ' src/components/admin/office-assistant.tsx
          grep -q 'confirm:finalize' src/components/admin/office-assistant.tsx
          grep -q 'GEMINI_API_KEY غير مضبوط' src/components/admin/office-assistant.tsx
          grep -q 'cases:c.cases.map' src/app/api/assistant/route.ts
          git diff --check HEAD^ HEAD
      - name: Remove verification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_final_ui_verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_final_ui_verify.yml
          git diff --cached --check
          git commit -m "chore: remove temporary assistant UI verification workflow"
          git push origin HEAD:fix/gemini-3-5-flash
