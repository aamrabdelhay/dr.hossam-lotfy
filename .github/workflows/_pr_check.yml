name: temporary-pr-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify assistant task UX source
        run: |
          set -euo pipefail
          grep -q 'مراجعة بيانات التنفيذ' src/components/admin/office-assistant.tsx
          grep -q 'تأكيد وتنفيذ المهمة' src/components/admin/office-assistant.tsx
          grep -q 'confirm:finalize' src/components/admin/office-assistant.tsx
          grep -q 'GEMINI_API_KEY غير مضبوط' src/components/admin/office-assistant.tsx
          grep -q 'cases:c.cases.map' src/app/api/assistant/route.ts
          grep -q 'gemini-3.5-flash' src/app/api/assistant/route.ts
          git diff --check
