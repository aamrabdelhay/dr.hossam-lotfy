name: Apply final office fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'feat: apply final office fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch UI labels and transition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/admin/admin-shell.tsx'); s=p.read_text()
          s=s.replace('              <QuickAction icon={<Users2 size={14} />} label="تكليفات" onClick={() => setModal({ kind: \'task\', data: { multi: true } })} />\n','')
          s=s.replace('              <QuickAction icon={<Building2 size={14} />} label="إضافة محكمة أو جهة" onClick={() => setModal({ kind: \'location\' })} />\n','')
          s=s.replace('              <QuickAction icon={<CalendarPlus size={14} />} label="إضافة جلسة" onClick={() => setModal({ kind: \'task\', data: { session: true } })} gold />','              <QuickAction icon={<CalendarPlus size={14} />} label="تكليف" onClick={() => setModal({ kind: \'task\', data: { session: true } })} gold />')
          p.write_text(s)
          p=Path('src/app/globals.css'); s=p.read_text()
          if '.page-enter' not in s:
              s += '\n/* Office page transition */\n@keyframes hl-page-enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n.page-enter { animation: hl-page-enter 420ms ease-out both; }\n@media (prefers-reduced-motion: reduce) { .page-enter { animation: none; } }\n'
              p.write_text(s)
          p=Path('src/app/cases/archive/page.tsx'); s=p.read_text().replace('>إدارة ملفات القضايا</Link>','>إدارة وتعديل القضايا</Link>'); p.write_text(s)
          for p in Path('src').rglob('*'):
              if p.is_file() and p.suffix in {'.tsx','.ts','.css'}:
                  s=p.read_text()
                  if '📞' in s: p.write_text(s.replace('📞',''))
          PY
      - name: Build verification
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-office-fixes.yml .github/workflows/apply-office-updates.yml .github/workflows/trigger-office-updates.yml
          git add -A
          git commit -m "feat: apply final office fixes"
          git push origin main