name: temporary-gemini-model-fix
on:
  push:
    branches:
      - fix/gemini-2-5-flash
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace invalid Gemini model everywhere
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' --include='*.js' 'gemini-3.8-flash' . | while IFS= read -r file; do
            sed -i 's/gemini-3\.8-flash/gemini-2.5-flash/g' "$file"
          done
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' --include='*.js' 'gemini-3.8-flash' .; then
            echo 'Old Gemini model still exists.'
            exit 1
          fi
          echo 'Remaining hard-coded Gemini model names:'
          grep -RInE --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' --include='*.js' 'gemini-[0-9][^'"'"'"'[:space:]'"'"'"'"'"'"'"'"'"']*' . || true
      - name: Commit only the requested model replacement
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_gemini_model_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached -- '*.ts' '*.tsx' '*.js'
          git commit -m "fix: use valid Gemini model (gemini-2.5-flash) instead of nonexistent gemini-3.8-flash"
          git push origin HEAD:fix/gemini-2-5-flash
