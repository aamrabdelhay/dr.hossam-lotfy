name: temporary-assistant-description-fix
on:
  push:
    branches:
      - fix/gemini-3-5-flash
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish assistant task input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/admin/office-assistant.tsx')
          s=p.read_text()
          s=s.replace("return text.replace(/\\*\\*/g,'').replace(/__/g,'').replace(/^\\s*[#*_]+\\s*/gm,'').replace(/^\\s*[-•]\\s+/gm,'').trim()", "return text.replace(/\\*/g,'').replace(/__/g,'').replace(/^\\s*[#_]+\\s*/gm,'').replace(/^\\s*[-•]\\s+/gm,'').trim()")
          s=s.replace("NVIDIA_API_KEY غير مضبوط بعد؛ الردود الذكية لن تعمل حتى تضيفه في Vercel.","GEMINI_API_KEY غير مضبوط بعد؛ الردود الذكية لن تعمل حتى تضيفه في Vercel.")
          p.write_text(s)
          p=Path('src/app/api/assistant/route.ts')
          s=p.read_text()
          old="description:kind==='session'?`جلسة${w?.s>=.5?` مع ${w.x.name}`:''}${l?.s>=.55?` في ${l.x.name}`:''}`:'مهمة جديدة'"
          new="description:kind==='session'?`جلسة${w?.s>=.5?` مع ${w.x.name}`:''}${l?.s>=.55?` في ${l.x.name}`:''}`:(q.replace(/^\\s*(عايز|محتاج|من فضلك|لو سمحت|اعمل|اعمل لي|حط|ضيف|اضف|سجل|كلف|مطلوب)\\s*/i,'').trim()||'مهمة جديدة')"
          s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_assistant_task_description_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/office-assistant.tsx src/app/api/assistant/route.ts .github/workflows/_assistant_task_description_fix.yml
          git diff --cached --check
          git commit -m "fix: preserve natural task intent in assistant review"
          git push origin HEAD:fix/gemini-3-5-flash
