name: temporary-assistant-task-finalize-fix
on:
  push:
    branches:
      - fix/gemini-3-5-flash
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix task review finalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/admin/office-assistant.tsx')
          s=p.read_text()
          s=s.replace("type Choice={id:string;name:string};", "type Choice={id:string;name:string;number?:string};")
          s=s.replace("const selectedLawyers=v.lawyerIds||[];return <div", "const selectedLawyers=v.lawyerIds||[];const presets=['مراجعة ملف','إعداد مذكرة','بحث قانوني','تجهيز مستندات','متابعة قضية','حضور جلسة'];return <div")
          s=s.replace("<label className=\"block text-[11px] font-bold text-navy-700\">وصف المهمة", "<div><div className=\"mb-1 text-[11px] font-bold text-navy-700\">اختر نوع المهمة</div><div className=\"grid grid-cols-2 gap-2 sm:grid-cols-3\">{presets.map(x=><button type=\"button\" key={x} onClick={()=>change('description',x)} className={v.description===x?'rounded-xl border border-gold-500 bg-gold-100 px-3 py-2 text-[11px] font-extrabold text-navy-950':'rounded-xl border border-navy-200 bg-white px-3 py-2 text-[11px] font-bold text-navy-700 hover:border-gold-400'}>{x}</button>)}</div></div><label className=\"block text-[11px] font-bold text-navy-700\">وصف المهمة")
          s=s.replace("change('caseNumber',c?.id||undefined);if(c){change('caseName',c.name)}", "change('caseNumber',c?.number||undefined);if(c){change('caseName',c.name)}")
          s=s.replace("type ActionForm({action,onDone,busy}", "type ActionForm({action,onDone,busy}")
          s=s.replace("onDone({...v,missing:undefined,choices:undefined})", "onDone({...v,missing:undefined,choices:undefined})")
          s=s.replace("const submit=async(text=input,action?:Action)=>", "const submit=async(text=input,action?:Action,finalize=false)=>")
          s=s.replace("body:JSON.stringify(action?{message:text,action}:{message:text})", "body:JSON.stringify(action?{message:text,action,confirm:finalize}:{message:text})")
          s=s.replace("const confirm=async(a:Action)=>{await submit('تأكيد تنفيذ الطلب',a)};", "const confirm=async(a:Action)=>{await submit('تأكيد وتنفيذ المهمة',a,true)};")
          s=s.replace("busy={busy}/>:m.action?<div className=\"mt-3 rounded-2xl border border-gold-200 bg-gold-50 p-3\"><p className=\"text-xs font-extrabold\">مراجعة قبل التنفيذ</p><p className=\"mt-1 text-xs leading-6\">{m.action.description}</p><button disabled={busy} onClick={()=>void confirm(m.action!)} className=\"mt-3 inline-flex items-center gap-2 rounded-xl bg-gold-500 px-4 py-2.5 text-xs font-extrabold text-navy-950\">تأكيد وتنفيذ <CheckCircle2 size={14}/></button></div>:null}", "busy={busy}/>:m.action?<ActionForm action={m.action} onDone={a=>void confirm(a)} busy={busy}/>:null}")
          s=s.replace("<div className=\"whitespace-pre-wrap\">{cleanAssistantText(m.text)}</div>", "<div className=\"whitespace-pre-wrap\">{m.action?'تمام، راجع بيانات المهمة وحدد القيم المطلوبة من الاختيارات التالية.':cleanAssistantText(m.text)}</div>")
          s=s.replace("مراجعة واعتماد</button></div>}", "تأكيد وتنفيذ المهمة</button></div>}")
          p.write_text(s)

          p=Path('src/app/api/assistant/route.ts')
          s=p.read_text()
          s=s.replace("type Choice={id:string;name:string};", "type Choice={id:string;name:string;number?:string};")
          s=s.replace("choices:{lawyers:c.lawyers,locations:c.locations,cases:c.cases.map((x:any)=>({id:x.id,name:`${x.name} — ${x.number}`}))}", "choices:{lawyers:c.lawyers,locations:c.locations,cases:c.cases.map((x:any)=>({id:x.id,name:x.name,number:x.number}))}")
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/components/admin/office-assistant.tsx src/app/api/assistant/route.ts
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_assistant_task_finalize_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/office-assistant.tsx src/app/api/assistant/route.ts .github/workflows/_assistant_task_finalize_fix.yml
          git diff --cached --check
          git commit -m "fix: make assistant task review actionable with choices"
          git push origin HEAD:fix/gemini-3-5-flash
